services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 30 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-before-use}"
      SEARXNG_REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)\"",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      FAST_LLM: "${FAST_LLM:-deepseek:deepseek-v4-flash}"
      SMART_LLM: "${SMART_LLM:-deepseek:deepseek-v4-flash}"
      STRATEGIC_LLM: "${STRATEGIC_LLM:-deepseek:deepseek-v4-pro}"
      EMBEDDING: "${EMBEDDING:-huggingface:sentence-transformers/all-MiniLM-L6-v2}"
      RETRIEVER: "searxng"
      SEARXNG_URL: "http://searxng:8080"
      RESEARCH_OUTPUT_DIR: "/data/outputs"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-30}"
      SITE_PASSWORD: "${SITE_PASSWORD:-}"
      APP_PORT: "${APP_PORT:-8000}"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${APP_PORT:-8000}",
      ]
    volumes:
      - ./outputs:/data/outputs
    expose:
      - "${APP_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,socket; socket.create_connection(('127.0.0.1', int(os.environ.get('APP_PORT', '8000'))), 3).close()\"",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --url http://app:${APP_PORT:-8000}

volumes:
  redis-data:
