[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deep-research-mcp"
version = "0.1.0"
description = "A local MCP server that builds section-based study documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gpt-researcher>=0.14.0",
    "httpx>=0.27.0",
    "litellm>=1.71.0",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[project.scripts]
deep-research-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
